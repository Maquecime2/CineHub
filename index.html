<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: without it, `env(safe-area-inset-*)` is zero
         everywhere and the phone's tab bar files itself under iOS's home
         bar. maximum-scale is deliberately absent: capping the zoom on a
         site full of small posters makes it unusable to whoever needs
         it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Ciné Hub</title>

    <!-- WHAT THE MANIFEST DOES NOT TELL IOS.

         Safari ignores the manifest for the icon, the name and full
         screen: it reads these tags, and only these. Without them, a
         binder laid on an iPhone's home screen takes a snapshot of the
         page for an icon, calls itself "Ciné Hub" in full underneath,
         and reopens an address bar. -->
    <!-- CE QUE LE LIEN MONTRE QUAND ON LE COLLE AILLEURS.

         Il n'y avait rien : une adresse partagée s'affichait en URL nue,
         sans titre ni phrase, ce qui est la façon la plus sûre de n'être
         cliqué par personne. La description est celle du produit, pas
         celle de la page — le classeur n'a qu'une adresse pour les
         moteurs et les aperçus, puisque ses vues vivent dans le
         fragment, que rien de tout cela ne lit.

         PAS DE `og:url` EN DUR : le site n'a pas encore son domaine, et
         une adresse fausse ici vaut moins que pas d'adresse du tout. -->
    <meta
      name="description"
      content="Une vidéothèque personnelle qui tient dans votre navigateur : rangez vos films, notez vos séances, écrivez vos critiques. Sans compte et sans serveur."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ciné Hub" />
    <meta property="og:title" content="Ciné Hub — votre vidéothèque, en carnet" />
    <meta
      property="og:description"
      content="Une vidéothèque personnelle qui tient dans votre navigateur : rangez vos films, notez vos séances, écrivez vos critiques. Sans compte et sans serveur."
    />
    <meta property="og:image" content="/icone-pomme-180.png" />
    <meta name="twitter:card" content="summary" />

    <link rel="apple-touch-icon" href="/icone-pomme-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ciné Hub" />
    <!-- The status bar takes the notebook's cardstock rather than the
         browser's white. `theme-color` holds for Android and the
         desktop. -->
    <meta name="theme-color" content="#EEE3CC" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
