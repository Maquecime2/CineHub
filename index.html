<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: without it, `env(safe-area-inset-*)` is zero
         everywhere and the phone's tab bar files itself under iOS's home
         bar. maximum-scale is deliberately absent: capping the zoom on a
         site full of small posters makes it unusable to whoever needs
         it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Ciné Hub</title>

    <!-- WHAT THE MANIFEST DOES NOT TELL IOS.

         Safari ignores the manifest for the icon, the name and full
         screen: it reads these tags, and only these. Without them, a
         binder laid on an iPhone's home screen takes a snapshot of the
         page for an icon, calls itself "Ciné Hub" in full underneath,
         and reopens an address bar. -->
    <link rel="apple-touch-icon" href="/icone-pomme-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ciné Hub" />
    <!-- The status bar takes the notebook's cardstock rather than the
         browser's white. `theme-color` holds for Android and the
         desktop. -->
    <meta name="theme-color" content="#EEE3CC" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
