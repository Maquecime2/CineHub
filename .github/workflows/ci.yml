name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un push qui en remplace un autre annule le run devenu inutile.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, tests et build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Trois tests du client entrent dans `server/src` — le bareme, les
      # affiches de demonstration, le prix des peaux — et de la, `demo.ts`
      # importe le type `Db`, donc `postgres`. Le programme que `tsc` compile
      # ici contient donc le serveur : sans ses dependances, le typage tombe
      # sur un module introuvable, et lui seul.
      - name: Dependances du serveur
        run: npm ci --prefix server

      - name: Lint
        run: npm run lint

      - name: Formatage
        run: npm run format:check

      - name: Typage
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
