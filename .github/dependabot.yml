version: 2

updates:
  # The updates are grouped: on a one-person project, one PR per package
  # would turn Dependabot into noise one ends up ignoring.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      # react and react-dom must go up together: apart, each breaks the
      # other's peer dependency and both PRs fail to install. No
      # `update-types` here — the major is precisely what must be grouped.
      react:
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
