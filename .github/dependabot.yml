version: 2

updates:
  # Les mises à jour sont groupées : sur un projet solo, une PR par paquet
  # transformerait Dependabot en bruit qu'on finit par ignorer.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      # react et react-dom doivent monter ensemble : séparés, chacun casse la
      # dépendance de pair de l'autre et les deux PR échouent à l'installation.
      # Pas de `update-types` ici — c'est justement la majeure qu'il faut grouper.
      react:
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
