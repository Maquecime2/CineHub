# The development Postgres, and nothing else. The server itself runs in
# the open on the machine: we want to watch it restart on every keystroke.
#
#   docker compose up -d
#   npm run dev
#
# The credentials are deliberately the same as in `.env.exemple`: this
# database listens on the machine only and holds nothing but trials.
services:
  base:
    image: postgres:17-alpine
    container_name: cinehub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cinehub
      POSTGRES_PASSWORD: cinehub
      POSTGRES_DB: cinehub
    ports:
      - "5432:5432"
    volumes:
      - donnees:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinehub"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  donnees:
